<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Playwright Test Report</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #eef2f7;
        color: #2d3748;
        font-size: 12px;
        padding: 24px;
      }
      .container {
        max-width: 1300px;
        margin: auto;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .header {
        background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
        color: #fff;
        padding: 24px 28px;
      }
      .header h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .header p {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 4px;
      }
      .status-bar {
        padding: 12px 28px;
        background: #f9fafb;
        border-bottom: 1px solid #e5e7eb;
        font-size: 12px;
      }
      .status-pass {
        color: #16a34a;
        font-weight: 700;
      }
      .status-fail {
        color: #dc2626;
        font-weight: 700;
      }
      .content {
        padding: 24px 28px;
      }
      h2 {
        font-size: 14px;
        font-weight: 700;
        color: #1f2937;
        margin: 0 0 12px;
        padding-bottom: 6px;
        border-bottom: 2px solid #e5e7eb;
      }
      .section {
        margin-bottom: 32px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11.5px;
        border: 1px solid #d1d5db;
      }
      th {
        background: #1f2937;
        color: #f9fafb;
        padding: 10px 12px;
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        border: 1px solid #d1d5db;
      }
      td {
        border: 1px solid #d1d5db;
        padding: 9px 12px;
        vertical-align: middle;
        word-break: break-word;
      }
      .row-pass {
        background: #dcfce7;
      }
      .row-fail {
        background: #fee2e2;
      }
      tr:hover td {
        filter: brightness(0.96);
      }
      .text-pass {
        color: #15803d;
        font-weight: 700;
      }
      .text-fail {
        color: #b91c1c;
        font-weight: 700;
      }
      .text-na {
        color: #b45309;
        font-weight: 700;
      }
      .url-link {
        color: #2563eb;
        text-decoration: none;
        font-size: 10.5px;
      }
      .url-link:hover {
        text-decoration: underline;
      }
      .reason-cell {
        font-size: 10.5px;
        color: #4b5563;
        white-space: pre-wrap;
      }
      .footer {
        text-align: center;
        font-size: 10px;
        color: #9ca3af;
        padding: 16px;
        border-top: 1px solid #e5e7eb;
      }
      .expandable {
        cursor: pointer;
        user-select: none;
      }
      .expandable:hover td {
        filter: brightness(0.93);
      }
      .detail-row {
        display: none;
      }
      .detail-row td {
        padding: 0;
        border-top: none;
      }
      .detail-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
      }
      .detail-table th {
        background: #374151;
        color: #f9fafb;
        padding: 7px 10px;
        font-size: 10.5px;
        text-transform: uppercase;
      }
      .detail-table td {
        padding: 7px 10px;
        border: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎭 Playwright Test Report</h1>
        <p>Generated on {{DATE}}</p>
      </div>

      <div class="status-bar">
        <b>Status :</b>
        <span class="status-{{STATUS_CLASS}}">{{OVERALL}}</span>
      </div>

      <div class="content">
        <div class="section">
          <h2>Platform Summary</h2>
          <table>
            <thead>
              <tr>
                <th>Platform</th>
                <th>Total Tests</th>
                <th>Passed</th>
                <th>Failed</th>
                <th>Privacy Failed</th>
                <th>Cookie Failed</th>
                <th>Legal Failed</th>
                <th>Submission Failed</th>
              </tr>
            </thead>
            <tbody>
              {{PLATFORM_ROWS}}
            </tbody>
          </table>
        </div>
      </div>
      <div class="footer">
        Generated automatically by Playwright Automation Framework
      </div>
    </div>
    <script>
      function toggleDetail(platform) {
        const row = document.getElementById("detail-" + platform);
        const isOpen = row.style.display === "table-row";
        row.style.display = isOpen ? "none" : "table-row";
        const arrow = row.previousElementSibling.querySelector("td b");
        arrow.textContent = (isOpen ? "▶ " : "▼ ") + platform;
      }
    </script>
  </body>
</html>
